# Nginx do HOST — proxy para container Docker na porta 8100
# Arquivo: /etc/nginx/sites-available/cameras

# HTTP por IP (acesso direto) — redireciona para HTTPS
server {
    listen 80;
    server_name 49.13.237.163;
    return 301 https://cameras.trsystem.com.br$request_uri;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name cameras.trsystem.com.br;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy para container
server {
    listen 443 ssl;
    server_name cameras.trsystem.com.br;

    ssl_certificate /etc/letsencrypt/live/cameras.trsystem.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cameras.trsystem.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    charset utf-8;

    client_max_body_size 500M;

    # go2rtc: proxia para dentro do container (que tem seu próprio go2rtc na 1984)
    location /go2rtc/ {
        proxy_pass http://127.0.0.1:8100/go2rtc/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }

    # Todo o resto vai para o container Laravel
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
    }
}
